name: Render Backend Keep Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          curl -f -s --max-time 30 https://vibeload-backend.onrender.com/api/health || echo "Ping attempted"
